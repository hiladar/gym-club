  html, body{ margin:0; padding:0; }
  :root{
    --bg-page:#F2EFE7;
    --bg-surface:#FFFFFF;
    --bg-sunken:#EAE6D9;
    --text-primary:#2A2A26;
    --text-secondary:#5E5C52;
    --text-muted:#8B8878;
    --border:rgba(42,42,38,0.12);
    --border-strong:rgba(42,42,38,0.18);
    --accent:#1E3A8A;
    --accent-strong:#152C6B;
    --accent-wash:rgba(30,58,138,0.12);
    --accent-ink-on:#FFFFFF;
    --good:#0ca30c;
    --warn:#a5720a;
    --warn-bg:#fdf1da;
    --shadow:0 8px 24px rgba(42,36,20,0.12), 0 2px 6px rgba(42,36,20,0.08);
    color-scheme:light;
  }
  @media (prefers-color-scheme: dark){
    :root:where(:not([data-theme="light"])){
      --bg-page:#141311;
      --bg-surface:#1E1D19;
      --bg-sunken:#211F1A;
      --text-primary:#EDEAE0;
      --text-secondary:#B9B6A9;
      --text-muted:#8C8A7C;
      --border:rgba(237,234,224,0.12);
      --border-strong:rgba(237,234,224,0.18);
      --accent:#3B5FC4;
      --accent-strong:#5578DE;
      --accent-wash:rgba(59,95,196,0.18);
      --accent-ink-on:#FFFFFF;
      --good:#3fc23f;
      --warn:#e0ad4d;
      --warn-bg:#3a2f14;
      --shadow:0 8px 28px rgba(0,0,0,0.45), 0 2px 8px rgba(0,0,0,0.3);
      color-scheme:dark;
    }
  }
  :root[data-theme="dark"]{
    --bg-page:#141311;
    --bg-surface:#1E1D19;
    --bg-sunken:#211F1A;
    --text-primary:#EDEAE0;
    --text-secondary:#B9B6A9;
    --text-muted:#8C8A7C;
    --border:rgba(237,234,224,0.12);
    --border-strong:rgba(237,234,224,0.18);
    --accent:#3B5FC4;
    --accent-strong:#5578DE;
    --accent-wash:rgba(59,95,196,0.18);
    --accent-ink-on:#FFFFFF;
    --good:#3fc23f;
    --warn:#e0ad4d;
    --warn-bg:#3a2f14;
    --shadow:0 8px 28px rgba(0,0,0,0.45), 0 2px 8px rgba(0,0,0,0.3);
    color-scheme:dark;
  }

  .gymapp, .gymapp *{ box-sizing:border-box; }
  .gymapp{
    direction:rtl;
    font-family:"Noto Sans Hebrew",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
    background:var(--bg-page);
    color:var(--text-primary);
    min-height:100vh;
    display:flex;
    flex-direction:column;
    font-size:14.5px;
    line-height:1.45;
  }
  .gymapp h1,.gymapp h2,.gymapp h3{
    font-family:"Noto Sans Hebrew",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
    font-weight:600;
    text-wrap:balance;
    margin:0;
  }

  /* breakpoint: below this, single-pane mobile navigation; at/above, two-pane desktop */
  :root{ --bp:760px; }

  /* top bar */
  .topbar{
    display:flex; align-items:center; justify-content:space-between;
    padding:12px 16px;
    background:var(--bg-surface);
    border-bottom:1px solid var(--border);
    position:sticky; top:0; z-index:20;
  }
  .brand{ display:flex; align-items:center; gap:8px; min-width:0; }
  .brand-logo{ width:30px; height:30px; border-radius:50%; object-fit:cover; flex:none; }
  .brand-text{ display:flex; align-items:baseline; gap:8px; min-width:0; }
  .brand h1{ font-size:17px; letter-spacing:.2px; white-space:nowrap; }
  .brand span{ color:var(--text-muted); font-size:11.5px; letter-spacing:.3px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .btn{
    appearance:none; border:1px solid var(--border-strong); background:var(--bg-surface);
    color:var(--text-primary); padding:9px 16px; border-radius:8px; font-size:14px; min-height:40px;
    cursor:pointer; display:inline-flex; align-items:center; gap:6px; font-family:inherit;
  }
  .btn:hover{ border-color:var(--accent); }
  .btn:focus-visible{ outline:2px solid var(--accent); outline-offset:2px; }
  .btn-accent{ background:var(--accent); border-color:var(--accent); color:var(--accent-ink-on); font-weight:600; }
  .btn-accent:hover{ background:var(--accent-strong); border-color:var(--accent-strong); }
  .btn-ghost{ border-color:transparent; background:transparent; }
  .btn-ghost:hover{ background:var(--bg-sunken); border-color:var(--border); }
  .btn-danger{ color:#c1362f; }
  .btn-sm{ padding:7px 12px; font-size:12.5px; border-radius:6px; min-height:34px; }
  .btn-icon{ padding:8px 10px; }
  .btn-icon-only{ width:40px; height:40px; padding:0; justify-content:center; flex:none; }
  .btn-icon-only svg{ width:16px; height:16px; }
  .topbar-newclient-label{ display:none; }
  @media (min-width:760px){ .topbar-newclient-label{ display:inline; } }

  .splash-screen{
    position:fixed; inset:0; z-index:9999;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    background:#1E1E1E; cursor:pointer;
    transition:opacity .4s ease, visibility 0s linear 0s;
  }
  .splash-screen.hide{ opacity:0; visibility:hidden; transition:opacity .4s ease, visibility 0s linear .4s; }
  .splash-logo{
    width:112px; height:112px; border-radius:50%; overflow:hidden; margin-bottom:16px;
    box-shadow:0 0 0 3px rgba(203,165,60,0.45), 0 14px 34px rgba(0,0,0,0.5);
  }
  .splash-logo img{ width:100%; height:100%; object-fit:cover; display:block; }
  .splash-tag{ color:#CBA53C; font-size:12px; letter-spacing:2px; font-weight:700; }
  @media (prefers-reduced-motion: reduce){ .splash-screen{ transition:none; } .splash-screen.hide{ transition:none; } }

  /* layout: mobile-first single pane, toggled by [data-view] on .shell */
  .shell{ display:flex; flex:1; min-height:0; position:relative; }
  .rail{
    width:100%; flex:none; background:var(--bg-surface);
    display:flex; flex-direction:column; min-height:0;
  }
  .main{ width:100%; flex:none; min-width:0; overflow-y:auto; padding:16px 16px 90px; }
  .shell[data-view="list"] .main{ display:none; }
  .shell[data-view="detail"] .rail{ display:none; }
  @media (min-width:760px){
    .rail{ width:290px; flex:none; border-inline-start:1px solid var(--border); display:flex !important; }
    .main{ flex:1; width:auto; display:block !important; padding:26px 30px 60px; }
  }

  .back-btn{ display:inline-flex; margin-bottom:2px; }
  @media (min-width:760px){ .back-btn{ display:none !important; } }

  .fab{
    position:fixed; inset-inline-end:20px; bottom:22px; z-index:30;
    width:52px; height:52px; border-radius:50%; border:none; cursor:pointer;
    background:var(--accent); color:var(--accent-ink-on); font-size:24px; line-height:1;
    display:flex; align-items:center; justify-content:center; box-shadow:var(--shadow);
  }
  .fab:hover{ background:var(--accent-strong); }
  @media (min-width:760px){ .fab{ display:none; } }

  .rail-search{ padding:12px 14px 8px; }
  .rail-search input{
    width:100%; padding:12px 12px; border-radius:8px; border:1px solid var(--border-strong);
    background:var(--bg-sunken); color:var(--text-primary); font-size:16px; font-family:inherit; min-height:44px;
  }
  .rail-search input:focus-visible{ outline:2px solid var(--accent); outline-offset:1px; }
  .rail-list{ overflow-y:auto; padding:6px 10px 90px; display:flex; flex-direction:column; gap:4px; }
  @media (min-width:760px){ .rail-list{ padding-bottom:14px; } }
  .client-item{
    display:flex; align-items:center; justify-content:space-between; gap:8px; text-align:start;
    padding:12px 12px; border-radius:9px; border:1px solid transparent; cursor:pointer;
    background:transparent; font-family:inherit; color:inherit; width:100%;
  }
  .client-item:hover{ background:var(--bg-sunken); }
  .client-item.active{ background:var(--accent-wash); border-color:var(--accent); }
  .client-item-text{ display:flex; flex-direction:column; gap:3px; min-width:0; }
  .client-name{ font-weight:600; font-size:14.5px; }
  .client-sub{ font-size:12px; color:var(--text-muted); display:flex; align-items:center; gap:6px; flex-wrap:wrap; }
  .client-chevron{ color:var(--text-muted); font-size:15px; flex:none; }
  @media (min-width:760px){ .client-chevron{ display:none; } }
  .chip{
    display:inline-flex; align-items:center; gap:4px; font-size:11px; font-weight:600;
    padding:2px 7px; border-radius:100px; white-space:nowrap;
  }
  .chip-warn{ background:var(--warn-bg); color:var(--warn); }
  .warn-icon{
    display:inline-flex; align-items:center; justify-content:center; flex:none;
    width:15px; height:15px; border-radius:50%; background:var(--warn-bg); color:var(--warn);
    font-size:10px; font-weight:800; line-height:1;
  }

  .empty-state{ display:flex; flex-direction:column; align-items:center; justify-content:center; height:70%; color:var(--text-muted); gap:8px; }

  .profile-head{ display:flex; align-items:flex-start; justify-content:space-between; gap:16px; margin-bottom:16px; flex-wrap:wrap; }
  .profile-head h2{ font-size:21px; }
  .profile-goal{ color:var(--text-secondary); font-size:13.5px; margin-top:3px; }
  @media (min-width:760px){ .profile-head h2{ font-size:24px; } }

  .tabs{ display:flex; gap:4px; border-bottom:1px solid var(--border); margin-bottom:20px; }
  .tab{
    padding:11px 12px; margin-inline-end:4px; background:none; border:none; cursor:pointer;
    font-family:inherit; font-size:14px; color:var(--text-muted); border-bottom:2px solid transparent;
    position:relative; top:1px; min-height:44px;
  }
  .tab.active{ color:var(--text-primary); border-bottom-color:var(--accent); font-weight:600; }
  .tab:focus-visible{ outline:2px solid var(--accent); outline-offset:2px; }

  .panel{ display:none; }
  .panel.active{ display:block; }

  .card{
    background:var(--bg-surface); border:1px solid var(--border); border-radius:12px;
    padding:18px 20px;
  }
  .grid-2{ display:grid; grid-template-columns:1fr; gap:14px 28px; }
  @media (min-width:760px){ .grid-2{ grid-template-columns:1fr 1fr; } }
  .field-label{ font-size:11.5px; color:var(--text-muted); text-transform:uppercase; letter-spacing:.4px; margin-bottom:3px; }
  .field-value{ font-size:14.5px; }
  .field-value.muted{ color:var(--text-muted); font-style:italic; }
  .section-title{ font-size:13px; color:var(--text-muted); text-transform:uppercase; letter-spacing:.5px; margin:22px 0 10px; }
  .section-title:first-child{ margin-top:0; }

  /* metric switcher + featured chart (mobile-first: one big chart, chips pick the metric) */
  .metric-chips{ display:grid; grid-template-columns:repeat(4,1fr); gap:8px; margin-bottom:14px; }
  @media (max-width:420px){ .metric-chips{ grid-template-columns:repeat(2,1fr); } }
  .metric-chip{
    text-align:start; border:1px solid var(--border); background:var(--bg-surface); border-radius:11px;
    padding:10px 12px; cursor:pointer; font-family:inherit; display:flex; flex-direction:column; gap:2px;
  }
  .metric-chip.active{ border-color:var(--accent); background:var(--accent-wash); }
  .metric-chip-label{ font-size:11.5px; color:var(--text-secondary); }
  .metric-chip-value{ font-size:17px; font-weight:600; font-variant-numeric:tabular-nums; }
  .metric-chip-value span{ font-size:11.5px; color:var(--text-muted); font-weight:400; }
  .featured-card{ background:var(--bg-surface); border:1px solid var(--border); border-radius:12px; padding:16px 18px 10px; margin-bottom:22px; }
  .stat-top{ display:flex; align-items:baseline; justify-content:space-between; margin-bottom:2px; }
  .stat-label{ font-size:12.5px; color:var(--text-secondary); }
  .stat-value{ font-size:30px; font-weight:600; }
  .stat-unit{ font-size:13px; color:var(--text-muted); font-weight:400; }
  .stat-delta{ font-size:12.5px; font-weight:600; color:var(--text-secondary); }
  .stat-delta.good{ color:var(--good); }
  .chart-wrap{ position:relative; margin-top:8px; }
  .chart-tooltip{
    position:absolute; pointer-events:none; background:var(--text-primary); color:var(--bg-surface);
    font-size:11.5px; padding:4px 8px; border-radius:6px; white-space:nowrap; transform:translate(-50%,-130%);
    opacity:0; transition:opacity .08s ease; font-variant-numeric:tabular-nums; z-index:5;
  }

  table.data{ width:100%; border-collapse:collapse; font-size:13.5px; }
  table.data th{
    text-align:start; font-size:11.5px; color:var(--text-muted); text-transform:uppercase;
    letter-spacing:.3px; font-weight:600; padding:8px 10px; border-bottom:1px solid var(--border);
  }
  table.data td{ padding:9px 10px; border-bottom:1px solid var(--border); font-variant-numeric:tabular-nums; }
  table.data tbody tr:hover{ background:var(--bg-sunken); }
  table.data td.actions{ white-space:nowrap; text-align:end; font-variant-numeric:normal; padding-inline-end:6px; }
  table.data td.actions .btn+.btn{ margin-inline-start:2px; }
  .table-scroll{ overflow-x:auto; }

  /* compact exercise cards for the training plan — replaces a long stacked field list */
  /* per exercise (name/sets/reps/weight/rest/notes) so the coach-notes section below stays reachable */
  /* named exview-* (not ex-*) to avoid colliding with the .ex-card exercise-row editor used in the plan form */
  .exview-list{ display:flex; flex-direction:column; gap:8px; }
  .exview-card{ border:1px solid var(--border); border-radius:12px; padding:10px 12px; }
  .exview-name{ font-size:15px; font-weight:700; margin-bottom:6px; }
  .exview-stats{ display:grid; grid-template-columns:repeat(4,1fr); gap:5px; }
  @media (max-width:420px){ .exview-stats{ grid-template-columns:repeat(2,1fr); } }
  .exview-stat{ background:var(--bg-sunken); border-radius:10px; padding:5px 6px; text-align:center; }
  .exview-stat-label{ display:block; font-size:10.5px; color:var(--text-muted); margin-bottom:2px; }
  .exview-stat-value{ display:block; font-size:13.5px; font-weight:700; font-variant-numeric:tabular-nums; }
  .exview-note{ margin-top:6px; padding-top:6px; border-top:1px dashed var(--border); font-size:12.5px; color:var(--text-secondary); }
  .exview-note-label{ color:var(--text-muted); margin-inline-end:4px; }

  /* below 700px: stacked "label / value" cards instead of a cramped wide grid — */
  /* avoids the one-word-per-line wrapping a narrow multi-column table forces */
  @media (max-width:699px){
    .table-scroll{ overflow-x:visible; }
    table.data.card-rows{ border-collapse:separate; border-spacing:0; }
    table.data.card-rows thead{ display:none; }
    table.data.card-rows, table.data.card-rows tbody, table.data.card-rows tr, table.data.card-rows td{ display:block; width:100%; }
    table.data.card-rows tr{
      border:1px solid var(--border); border-radius:10px; padding:4px 12px; margin-bottom:10px;
    }
    table.data.card-rows tbody tr:hover{ background:none; }
    table.data.card-rows tr:last-child{ margin-bottom:0; }
    table.data.card-rows td{
      display:flex; align-items:baseline; justify-content:flex-start; gap:10px;
      padding:7px 0; border-bottom:1px dashed var(--border); text-align:start;
    }
    table.data.card-rows td:last-of-type{ border-bottom:none; }
    table.data.card-rows td::before{
      content:attr(data-label); color:var(--text-muted); font-size:11.5px; text-transform:uppercase;
      letter-spacing:.3px; text-align:start; flex:none;
    }
    table.data.card-rows td.actions{
      justify-content:flex-end; border-bottom:none; padding-top:8px;
    }
    table.data.card-rows td.actions::before{ content:none; }
    table.data.card-rows td.wrap-value{ flex-direction:column; align-items:flex-start; gap:3px; }
    table.data.card-rows td.wrap-value::before{ text-align:start; }
  }

  .plan-banner{
    display:flex; align-items:center; justify-content:space-between; gap:10px;
    background:var(--accent-wash); border:1px solid var(--accent); color:var(--accent-strong);
    padding:9px 14px; border-radius:9px; margin-bottom:16px; font-size:13px;
  }
  .plan-meta{ display:flex; align-items:center; justify-content:space-between; margin-bottom:14px; flex-wrap:wrap; gap:10px; }
  .plan-meta h3{ font-size:16px; }
  select.select{
    padding:7px 10px; border-radius:8px; border:1px solid var(--border-strong);
    background:var(--bg-surface); color:var(--text-primary); font-family:inherit; font-size:13px;
  }

  /* modal: bottom sheet on mobile, centered dialog on desktop */
  /* #overlay lives outside .gymapp, so it needs its own box-sizing/font/color —
     without these the form inputs fall back to content-box (width:100% + padding
     overflows the grid column and the fields overlap) and to the default serif. */
  .overlay{
    position:fixed; inset:0; background:rgba(15,16,18,0.45); display:none;
    align-items:flex-end; justify-content:center; z-index:100; padding:0; overflow-y:auto;
    font-family:"Noto Sans Hebrew",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
    color:var(--text-primary);
  }
  .overlay, .overlay *{ box-sizing:border-box; }
  .overlay.open{ display:flex; }
  .modal{
    background:var(--bg-surface); border-radius:16px 16px 0 0; width:100%; max-width:100%;
    box-shadow:var(--shadow); border:1px solid var(--border); border-bottom:none;
  }
  @media (min-width:760px){
    .overlay{ align-items:flex-start; padding:5vh 16px; }
    .modal{ border-radius:14px; max-width:560px; border-bottom:1px solid var(--border); }
  }
  .modal-head{ display:flex; align-items:center; justify-content:space-between; padding:16px 20px; border-bottom:1px solid var(--border); }
  .modal-head h3{ font-size:17px; }
  .modal-body{ padding:18px 20px; display:flex; flex-direction:column; gap:14px; max-height:65vh; overflow-y:auto; }
  .modal-foot{ display:flex; justify-content:flex-end; gap:8px; padding:14px 20px; border-top:1px solid var(--border); }
  .form-row{ display:flex; flex-direction:column; gap:5px; }
  .form-row label{ font-size:12px; color:var(--text-secondary); font-weight:600; }
  .form-row input, .form-row textarea, .form-row select{
    padding:12px 12px; border-radius:8px; border:1px solid var(--border-strong);
    background:var(--bg-sunken); color:var(--text-primary); font-family:inherit; font-size:16px;
    width:100%; min-height:44px;
  }
  .form-row input:focus-visible, .form-row textarea:focus-visible, .form-row select:focus-visible{
    outline:2px solid var(--accent); outline-offset:1px;
  }
  .form-row textarea{ resize:vertical; min-height:56px; }
  .form-grid{ display:grid; grid-template-columns:1fr 1fr; gap:12px; }
  @media (max-width:479px){ .form-grid{ grid-template-columns:1fr; } }

  .ex-card{ border:1px solid var(--border); border-radius:10px; padding:12px; margin-bottom:10px; background:var(--bg-sunken); }
  .ex-card-top{ display:flex; align-items:center; gap:8px; margin-bottom:8px; }
  .ex-card-top input{ flex:1; font-weight:600; }
  .ex-card-grid3{ display:grid; grid-template-columns:1fr 1fr 1fr; gap:8px; margin-bottom:8px; }
  .ex-card-grid2{ display:grid; grid-template-columns:1fr 1fr; gap:8px; }
  @media (max-width:479px){ .ex-card-grid3{ grid-template-columns:1fr 1fr; } .ex-card-grid2{ grid-template-columns:1fr; } }
  .ex-field-label{ display:block; font-size:10.5px; color:var(--text-muted); margin-bottom:3px; }
  .ex-card input{
    width:100%; padding:12px 12px; border-radius:8px; border:1px solid var(--border-strong);
    background:var(--bg-surface); color:var(--text-primary); font-family:inherit; font-size:16px; min-height:44px;
  }
  .ex-card input:focus-visible{ outline:2px solid var(--accent); outline-offset:1px; }

  .hidden{ display:none !important; }

  /* client role: view-only, single-client layout — hide every edit/create affordance */
  .app-readonly .edit-only{ display:none !important; }
  .app-readonly .rail{ display:none !important; }
  .app-readonly .fab{ display:none !important; }
  .app-readonly .back-btn{ display:none !important; }

  .login-screen{
    position:fixed; inset:0; z-index:200; display:flex; align-items:center; justify-content:center;
    background:var(--bg-page); padding:20px; box-sizing:border-box;
    direction:rtl; font-family:"Noto Sans Hebrew",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
    color:var(--text-primary);
  }
  .login-screen *{ box-sizing:border-box; }
  .login-card{
    width:100%; max-width:360px; background:var(--bg-surface); border:1px solid var(--border);
    border-radius:16px; box-shadow:var(--shadow); padding:28px 24px; display:flex; flex-direction:column; gap:14px;
  }
  .login-card h2{
    font-size:19px; text-align:center; margin:0 0 4px;
    font-family:"Noto Sans Hebrew",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif; font-weight:600;
  }
  .login-card .form-row label{ font-size:12px; color:var(--text-secondary); font-weight:600; }
  .login-card .form-row input{
    padding:12px 12px; border-radius:8px; border:1px solid var(--border-strong);
    background:var(--bg-sunken); color:var(--text-primary); font-family:inherit; font-size:16px; width:100%; min-height:44px;
  }
  .login-error{ background:var(--warn-bg); color:var(--warn); font-size:12.5px; padding:8px 10px; border-radius:8px; }
  .login-card .btn{ justify-content:center; }
</style>
</head>

async function determineRole(session){
  var uid = session.user.id;
  var tRes = await sb.from('trainers').select('id,role').eq('auth_user_id', uid).maybeSingle();
  if(tRes.error) throw tRes.error;
  if(tRes.data) return { role: tRes.data.role, trainerId: tRes.data.id, clientId: null };
  var cRes = await sb.from('clients').select('id').eq('auth_user_id', uid).maybeSingle();
  if(cRes.error) throw cRes.error;
  if(cRes.data) return { role: 'client', trainerId: null, clientId: cRes.data.id };
  return null;
}

var GENDER_DB_TO_UI = {male:'גבר', female:'אישה', other:'אחר'};
var GENDER_UI_TO_DB = {'גבר':'male', 'אישה':'female', 'אחר':'other'};
function doctorApprovalToUi(v){ return v===true ? 'כן' : v===false ? 'לא' : ''; }
function doctorApprovalToDb(v){ return v==='כן' ? true : v==='לא' ? false : null; }

function clientFromRow(row){
  return {
    id: row.id, name: row.full_name, phone: row.phone, email: row.email, dob: row.date_of_birth,
    gender: GENDER_DB_TO_UI[row.gender] || '', height: row.height_cm, photo: row.profile_photo_url,
    goal: row.training_goal, medical: row.medical_condition, injuries: row.injuries_limitations,
    meds: row.medications, doctorApproval: doctorApprovalToUi(row.doctor_approval),
    emergencyName: row.emergency_contact_name, emergencyPhone: row.emergency_contact_phone,
    measurements: [], plans: [], trainingNotes: []
  };
}
function clientToRow(data){
  return {
    full_name: data.name, phone: data.phone||null, email: data.email||null, date_of_birth: data.dob||null,
    gender: GENDER_UI_TO_DB[data.gender] || null, height_cm: data.height||null,
    training_goal: data.goal||null, medical_condition: data.medical||null, injuries_limitations: data.injuries||null,
    medications: data.meds||null, doctor_approval: doctorApprovalToDb(data.doctorApproval),
    emergency_contact_name: data.emergencyName||null, emergency_contact_phone: data.emergencyPhone||null
  };
}
function measurementFromRow(row){
  return {
    id: row.id, date: row.date, weight: row.weight_kg, fat: row.body_fat_percent, water: row.water_percent,
    muscle: row.muscle_mass_kg, fatMass: row.fat_mass_kg, waist: row.waist_cm, chest: row.chest_cm,
    arm: row.arm_cm, thigh: row.thigh_cm, notes: row.notes
  };
}
function measurementToRow(data, clientId){
  return {
    client_id: clientId, date: data.date, weight_kg: data.weight, body_fat_percent: data.fat,
    water_percent: data.water, muscle_mass_kg: data.muscle, fat_mass_kg: data.fatMass,
    waist_cm: data.waist, chest_cm: data.chest, arm_cm: data.arm, thigh_cm: data.thigh, notes: data.notes||null
  };
}
function planFromRow(row){
  return { id: row.id, effectiveDate: row.effective_date, coachNotes: row.coach_notes, exercises: [] };
}
function exerciseFromRow(row){
  return { name: row.exercise_name, sets: row.sets, reps: row.reps, weight: row.working_weight_kg, rest: row.rest_time, notes: row.notes };
}
function noteFromRow(row){
  return { id: row.id, date: row.date, time: row.time ? row.time.slice(0,5) : '', note: row.note, audioUrl: row.audio_url || null };
}
function slotFromRow(row){
  return {
    id: row.id, trainerId: row.trainer_id, date: row.date,
    startTime: row.start_time ? row.start_time.slice(0,5) : '', endTime: row.end_time ? row.end_time.slice(0,5) : '',
    status: row.status, clientId: row.client_id || null
  };
}
var SLOT_LENGTH_MIN = 50; // fixed session length, see PROJECT.md ("מודול תיאום אימונים")
function addMinutesToTime(hhmm, minutes){
  var parts = hhmm.split(':'); var total = (parseInt(parts[0],10)*60 + parseInt(parts[1],10) + minutes) % (24*60);
  var h = Math.floor(total/60), m = total%60;
  return (h<10?'0':'')+h+':'+(m<10?'0':'')+m;
}

async function loadState(){
  var res = await Promise.all([
    sb.from('trainers').select('*'),
    sb.from('clients').select('*'),
    sb.from('measurements').select('*').order('date'),
    sb.from('training_plans').select('*').order('effective_date'),
    sb.from('training_plan_exercises').select('*').order('order_index'),
    sb.from('training_notes').select('*').order('date'),
    sb.from('training_slots').select('*').order('date').order('start_time')
  ]);
  for(var i=0;i<res.length;i++){
    if(res[i].error){ alert('שגיאה בטעינת נתונים מהשרת: '+res[i].error.message); throw res[i].error; }
  }
  var trainers = res[0].data, clientRows = res[1].data,
      measurementRows = res[2].data, planRows = res[3].data, exerciseRows = res[4].data, noteRows = res[5].data,
      slotRows = res[6].data;

  state.trainers = trainers.map(function(t){ return {id:t.id, name:t.full_name}; });

  var clients = clientRows.map(clientFromRow);
  clients.forEach(function(c){
    c.measurements = measurementRows.filter(function(m){ return m.client_id===c.id; }).map(measurementFromRow);
    c.plans = planRows.filter(function(p){ return p.client_id===c.id; }).map(function(p){
      var plan = planFromRow(p);
      plan.exercises = exerciseRows.filter(function(e){ return e.training_plan_id===p.id; }).map(exerciseFromRow);
      return plan;
    });
    c.trainingNotes = noteRows.filter(function(n){ return n.client_id===c.id; }).map(noteFromRow);
  });
  state.clients = clients;
  state.slots = slotRows.map(slotFromRow);
}

/* ---------- mini chart ---------- */
function renderMiniChart(container, points, opts){
  container.innerHTML = '';
  var w = 240, h = (opts && opts.height) || 72, padL = 6, padR = 6, padT = 10, padB = 6;
  var values = points.map(function(p){ return p.value; });
  var min = Math.min.apply(null, values), max = Math.max.apply(null, values);
  if(min===max){ min -= 1; max += 1; }
  var span = max-min;
  min -= span*0.12; max += span*0.12; span = max-min;

  var xs = points.map(function(p,i){ return padL + (i/(points.length-1))*(w-padL-padR); });
  var ys = points.map(function(p){ return padT + (1-((p.value-min)/span))*(h-padT-padB); });

  var svg = document.createElementNS('http://www.w3.org/2000/svg','svg');
  svg.setAttribute('viewBox','0 0 '+w+' '+h);
  svg.setAttribute('preserveAspectRatio','none');
  svg.setAttribute('width','100%');
  svg.setAttribute('height',h);
  svg.style.display='block';
  svg.style.overflow='visible';

  var css = getComputedStyle(container);
  var accent = css.getPropertyValue('--accent').trim() || '#AD7A28';
  var gridColor = css.getPropertyValue('--border').trim() || 'rgba(0,0,0,.1)';
  var surface = css.getPropertyValue('--bg-surface').trim() || '#fff';

  // baseline
  var base = document.createElementNS(svg.namespaceURI,'line');
  base.setAttribute('x1', padL); base.setAttribute('x2', w-padR);
  base.setAttribute('y1', h-padB); base.setAttribute('y2', h-padB);
  base.setAttribute('stroke', gridColor); base.setAttribute('stroke-width','1');
  svg.appendChild(base);

  // area
  var areaD = 'M'+xs[0]+','+(h-padB)+' ';
  xs.forEach(function(x,i){ areaD += 'L'+x+','+ys[i]+' '; });
  areaD += 'L'+xs[xs.length-1]+','+(h-padB)+' Z';
  var area = document.createElementNS(svg.namespaceURI,'path');
  area.setAttribute('d', areaD);
  area.setAttribute('fill', accent);
  area.setAttribute('opacity', '0.10');
  svg.appendChild(area);

  // line
  var lineD = 'M'+xs[0]+','+ys[0]+' ';
  xs.forEach(function(x,i){ if(i>0) lineD += 'L'+x+','+ys[i]+' '; });
  var line = document.createElementNS(svg.namespaceURI,'path');
  line.setAttribute('d', lineD);
  line.setAttribute('fill','none');
  line.setAttribute('stroke', accent);
  line.setAttribute('stroke-width','2');
  line.setAttribute('stroke-linecap','round');
  line.setAttribute('stroke-linejoin','round');
  svg.appendChild(line);

  // endpoint marker with surface ring
  var lastX = xs[xs.length-1], lastY = ys[ys.length-1];
  var ring = document.createElementNS(svg.namespaceURI,'circle');
  ring.setAttribute('cx',lastX); ring.setAttribute('cy',lastY); ring.setAttribute('r','6');
  ring.setAttribute('fill', surface);
  svg.appendChild(ring);
  var dot = document.createElementNS(svg.namespaceURI,'circle');
  dot.setAttribute('cx',lastX); dot.setAttribute('cy',lastY); dot.setAttribute('r','4');
  dot.setAttribute('fill', accent);
  svg.appendChild(dot);

  // hover layer
  var crosshair = document.createElementNS(svg.namespaceURI,'line');
  crosshair.setAttribute('y1', padT-4); crosshair.setAttribute('y2', h-padB);
  crosshair.setAttribute('stroke', gridColor); crosshair.setAttribute('stroke-width','1');
  crosshair.style.display='none';
  svg.appendChild(crosshair);
  var hoverDot = document.createElementNS(svg.namespaceURI,'circle');
  hoverDot.setAttribute('r','4'); hoverDot.setAttribute('fill', accent);
  hoverDot.style.display='none';
  svg.appendChild(hoverDot);

  var hitRect = document.createElementNS(svg.namespaceURI,'rect');
  hitRect.setAttribute('x','0'); hitRect.setAttribute('y','0');
  hitRect.setAttribute('width',w); hitRect.setAttribute('height',h);
  hitRect.setAttribute('fill','transparent');
  svg.appendChild(hitRect);

  var wrap = document.createElement('div');
  wrap.className = 'chart-wrap';
  var tooltip = document.createElement('div');
  tooltip.className = 'chart-tooltip';
  wrap.appendChild(svg);
  wrap.appendChild(tooltip);
  container.appendChild(wrap);

  hitRect.addEventListener('mousemove', function(e){
    var rect = svg.getBoundingClientRect();
    var relX = (e.clientX-rect.left) / rect.width * w;
    var idx = 0, best = Infinity;
    xs.forEach(function(x,i){ var d = Math.abs(x-relX); if(d<best){ best=d; idx=i; } });
    crosshair.setAttribute('x1', xs[idx]); crosshair.setAttribute('x2', xs[idx]);
    crosshair.style.display='block';
    hoverDot.setAttribute('cx', xs[idx]); hoverDot.setAttribute('cy', ys[idx]);
    hoverDot.style.display='block';
    tooltip.style.opacity='1';
    tooltip.style.left = (xs[idx]/w*100)+'%';
    tooltip.style.top = (ys[idx]/h*100)+'%';
    tooltip.textContent = fmtDate(points[idx].date)+' · '+fmt(points[idx].value)+(opts.unit||'');
  });
  hitRect.addEventListener('mouseleave', function(){
    crosshair.style.display='none'; hoverDot.style.display='none'; tooltip.style.opacity='0';
  });
}

var METRICS = [
  {key:'weight', label:'משקל', unit:' ק"ג', goodDir:null},
  {key:'fat', label:'אחוז שומן', unit:'%', goodDir:'down'},
  {key:'muscle', label:'מסת שריר', unit:' ק"ג', goodDir:'up'},
  {key:'water', label:'אחוז נוזלים', unit:'%', goodDir:null}
];

function metricDelta(client, key, goodDir){
  var vals = client.measurements.map(function(m){ return m[key]; });
  var last = vals[vals.length-1], prev = vals.length>1 ? vals[vals.length-2] : last;
  var delta = last-prev;
  var deltaClass = '';
  if(goodDir==='down' && delta<0) deltaClass='good';
  if(goodDir==='up' && delta>0) deltaClass='good';
  return {last:last, delta:delta, deltaClass:deltaClass, arrow: delta===0?'—':(delta>0?'▲':'▼')};
}

function renderMetricSwitcher(panel, client){
  var chipsEl = $('#metricChips', panel);
  chipsEl.innerHTML = METRICS.map(function(m){
    var d = metricDelta(client, m.key, m.goodDir);
    return '<button class="metric-chip'+(state.featuredMetric===m.key?' active':'')+'" data-metric="'+m.key+'">'+
      '<span class="metric-chip-label">'+m.label+'</span>'+
      '<span class="metric-chip-value">'+fmt(d.last)+'<span>'+m.unit+'</span></span>'+
    '</button>';
  }).join('');
  $$('[data-metric]', chipsEl).forEach(function(b){
    b.addEventListener('click', function(){
      state.featuredMetric = b.dataset.metric;
      renderMetricSwitcher(panel, client);
      renderFeaturedChart(panel, client);
    });
  });
}

function renderFeaturedChart(panel, client){
  var m = METRICS.find(function(x){ return x.key===state.featuredMetric; }) || METRICS[0];
  var d = metricDelta(client, m.key, m.goodDir);
  var host = $('#featuredCard', panel);
  host.innerHTML =
    '<div class="stat-top"><span class="stat-label">'+m.label+' לאורך זמן</span>'+
    '<span class="stat-delta '+d.deltaClass+'">'+d.arrow+' '+fmt(Math.abs(d.delta))+m.unit+' מהמדידה הקודמת</span></div>'+
    '<div class="stat-value">'+fmt(d.last)+' <span class="stat-unit">'+m.unit+'</span></div>';
  var pts = client.measurements.map(function(x){ return {date:x.date, value:x[m.key]}; });
  var chartHost = document.createElement('div');
  host.appendChild(chartHost);
  renderMiniChart(chartHost, pts, {unit:m.unit, height:140});
}

/* a training note belongs to whichever plan version was in effect on its date — */
/* the version's effectiveDate up to (not including) the next version's effectiveDate, or open-ended for the latest */
function notesForPlanVersion(client, sortedPlans, viewing){
  var idx = sortedPlans.findIndex(function(p){ return p.id===viewing.id; });
  var upperBound = idx > 0 ? sortedPlans[idx-1].effectiveDate : null;
  return (client.trainingNotes||[]).filter(function(n){
    return n.date >= viewing.effectiveDate && (upperBound===null || n.date < upperBound);
  });
}

function openTrainingNoteForm(client, note){
  var isNew = !note;
  var now = new Date();
  var v = note || {date:now.toISOString().slice(0,10), time:now.toTimeString().slice(0,5), note:'', audioUrl:null};
  var body =
    '<div class="form-grid">'+
      '<div class="form-row"><label>תאריך</label><input type="date" id="f_notedate" value="'+v.date+'"></div>'+
      '<div class="form-row"><label>שעה</label><input type="time" id="f_notetime" value="'+v.time+'"></div>'+
    '</div>'+
    '<div class="form-row"><label>הערה</label>'+
      '<div style="display:flex;gap:8px;align-items:flex-start;">'+
        '<textarea id="f_notetext" style="flex:1;">'+(v.note||'')+'</textarea>'+
        '<button type="button" class="btn btn-icon-only btn-ghost" id="btnRecordNote" title="הקלטת הערה">'+ICON_MIC+'</button>'+
      '</div>'+
      '<div id="recordStatus" class="field-value muted" style="font-size:12.5px;margin-top:4px;"></div>'+
      '<div id="audioPreviewWrap" style="margin-top:6px;"></div>'+
    '</div>';
  var foot = '<button class="btn" id="btnCancel">ביטול</button><button class="btn btn-accent" id="btnSave">שמירה</button>';
  openModal(isNew ? 'הערת אימון חדשה' : 'עריכת הערת אימון', body, foot);

  var recordedBlob = null;          // new recording made in this session, pending upload on save
  var keptAudioUrl = v.audioUrl || null; // existing audio, kept unless overwritten by a new recording
  var mediaRecorder = null, mediaChunks = [], micStream = null, recording = false;
  var textarea = $('#f_notetext');
  var recordBtn = $('#btnRecordNote');
  var statusEl = $('#recordStatus');
  var previewWrap = $('#audioPreviewWrap');
  var baseText = textarea.value;

  function renderAudioPreview(){
    if(recordedBlob){
      previewWrap.innerHTML = '<audio controls src="'+URL.createObjectURL(recordedBlob)+'" style="height:32px;max-width:260px;"></audio>';
    } else if(keptAudioUrl){
      previewWrap.innerHTML = '<audio controls src="'+keptAudioUrl+'" style="height:32px;max-width:260px;"></audio>';
    } else {
      previewWrap.innerHTML = '';
    }
  }
  renderAudioPreview();
  modalCloseCleanup = function(){ if(recording) stopRecording(); };

  function startRecording(){
    navigator.mediaDevices.getUserMedia({audio:true}).then(function(stream){
      micStream = stream;
      mediaChunks = [];
      baseText = textarea.value;
      mediaRecorder = new MediaRecorder(stream);
      mediaRecorder.addEventListener('dataavailable', function(e){ if(e.data.size>0) mediaChunks.push(e.data); });
      mediaRecorder.addEventListener('stop', function(){
        recordedBlob = new Blob(mediaChunks, {type: mediaRecorder.mimeType || 'audio/webm'});
        renderAudioPreview();
        micStream.getTracks().forEach(function(t){ t.stop(); });
        transcribeRecording();
      });
      mediaRecorder.start();

      recording = true;
      recordBtn.innerHTML = ICON_STOP;
      recordBtn.classList.remove('btn-ghost');
      recordBtn.classList.add('btn-accent');
      recordBtn.title = 'עצירת הקלטה';
      statusEl.textContent = 'מקליט…';
    }).catch(function(err){
      alert('לא ניתן לגשת למיקרופון: '+err.message);
    });
  }

  function stopRecording(){
    recording = false;
    recordBtn.innerHTML = ICON_MIC;
    recordBtn.classList.remove('btn-accent');
    recordBtn.classList.add('btn-ghost');
    recordBtn.title = 'הקלטת הערה';
    if(mediaRecorder && mediaRecorder.state !== 'inactive') mediaRecorder.stop();
  }

  async function transcribeRecording(){
    recordBtn.disabled = true;
    statusEl.textContent = 'מתמלל…';
    try{
      var fd = new FormData();
      fd.append('audio', recordedBlob, 'note.webm');
      var res = await sb.functions.invoke('transcribe-audio', { body: fd });
      if(res.error) throw res.error;
      var transcript = ((res.data && res.data.text) || '').trim();
      if(transcript){
        textarea.value = (baseText ? baseText+' ' : '') + transcript;
      }
      statusEl.textContent = transcript ? '' : 'לא זוהה טקסט בהקלטה — אפשר להקליד את ההערה ידנית.';
    } catch(err){
      statusEl.textContent = 'התמלול נכשל — אפשר להקליד את ההערה ידנית.';
    } finally {
      recordBtn.disabled = false;
    }
  }

  recordBtn.addEventListener('click', function(){
    if(!navigator.mediaDevices || !window.MediaRecorder){
      alert('הקלטת אודיו אינה נתמכת בדפדפן זה.');
      return;
    }
    if(recording) stopRecording(); else startRecording();
  });

  $('#btnCancel').addEventListener('click', closeModal);
  $('#btnSave').addEventListener('click', async function(){
    if(recording) stopRecording();
    var text = $('#f_notetext').value.trim();
    if(!text){ alert('יש להזין טקסט הערה'); return; }

    var audioUrl = keptAudioUrl;
    if(recordedBlob){
      var path = client.id+'/'+Date.now()+'.webm';
      var up = await sb.storage.from('training-note-audio').upload(path, recordedBlob, {contentType: recordedBlob.type});
      if(up.error){ alert('שגיאה בהעלאת ההקלטה: '+up.error.message); return; }
      audioUrl = sb.storage.from('training-note-audio').getPublicUrl(path).data.publicUrl;
    }

    var data = { date:$('#f_notedate').value, time:$('#f_notetime').value, note:text, audioUrl: audioUrl };
    if(isNew){
      var res = await sb.from('training_notes').insert({client_id:client.id, date:data.date, time:data.time, note:data.note, audio_url:data.audioUrl}).select().single();
      if(res.error){ alert('שגיאה בשמירת ההערה: '+res.error.message); return; }
      data.id = res.data.id;
      client.trainingNotes = client.trainingNotes || [];
      client.trainingNotes.push(data);
    } else {
      var res = await sb.from('training_notes').update({date:data.date, time:data.time, note:data.note, audio_url:data.audioUrl}).eq('id', note.id);
      if(res.error){ alert('שגיאה בעדכון ההערה: '+res.error.message); return; }
      Object.assign(note, data);
    }
    closeModal();
    renderMain();
  });
}

var modalCloseCleanup = null; // optional callback set by a form to release resources (e.g. an open mic stream) however the modal closes
function hideModalDom(){
  $('#overlay').classList.remove('open'); $('#modal').innerHTML='';
  if(modalCloseCleanup){ modalCloseCleanup(); modalCloseCleanup = null; }
}
function closeModal(){
  if(history.state && history.state.modal){ history.back(); }
  else { hideModalDom(); }
}

/* ---------- top-level nav: client list/detail shell vs. scheduling module (18.08.26) ---------- */
function updateNavActive(){
  var onSchedule = state.view === 'schedule';
  $('#navMain').className = 'btn btn-sm ' + (onSchedule ? 'btn-ghost' : 'btn-accent');
  $('#navSchedule').className = 'btn btn-sm ' + (onSchedule ? 'btn-accent' : 'btn-ghost');
}
function showScheduleView(){
  state.view = 'schedule';
  $('#shell').classList.add('hidden');
  $('#scheduleShell').classList.remove('hidden');
  updateNavActive();
  renderSchedule();
}
function restoreMainFromHistory(s){
  state.view = 'main';
  $('#scheduleShell').classList.add('hidden');
  $('#shell').classList.remove('hidden');
  updateNavActive();
  if(currentUser.role === 'client'){
    $('#shell').setAttribute('data-view', 'detail'); /* client has one client, no list to go back to */
    renderAll();
    return;
  }
  if(s && s.view === 'detail' && s.clientId){
    state.activeClientId = s.clientId;
    $('#shell').setAttribute('data-view', 'detail');
  } else {
    $('#shell').setAttribute('data-view', 'list');
  }
  renderAll();
}
function goToSchedule(){
  if(state.view === 'schedule') return;
  showScheduleView();
  history.pushState({topView:'schedule'}, '', location.href);
}
function goToMainNav(){
  if(state.view !== 'schedule') return;
  history.back(); /* popstate restores whatever main-shell state was there before */
}

window.addEventListener('popstate', function(e){
  hideModalDom();
  var s = e.state;
  if(s && s.topView === 'schedule'){ showScheduleView(); return; }
  restoreMainFromHistory(s);
});

/* ---------- scheduling module screens (18.08.26) — see PROJECT.md "מודול תיאום אימונים" ---------- */
function sortSlots(list){
  return list.slice().sort(function(a,b){
    var da = a.date+' '+a.startTime, db = b.date+' '+b.startTime;
    return da<db ? -1 : (da>db ? 1 : 0);
  });
}
function slotChipHtml(status){
  return status==='open'
    ? '<span class="chip" style="background:var(--accent-wash);color:var(--accent);">פנוי</span>'
    : '<span class="chip chip-warn">תפוס</span>';
}
function slotCardHtml(dateTimeLabel, subLabel, chipOrActionHtml){
  return '<div class="card" style="margin-bottom:8px;padding:12px 14px;display:flex;align-items:center;justify-content:space-between;gap:10px;">'+
    '<div><div style="font-weight:600;">'+dateTimeLabel+'</div>'+(subLabel?'<div class="client-sub">'+subLabel+'</div>':'')+'</div>'+
    chipOrActionHtml+
  '</div>';
}

function renderSchedule(){
  var main = $('#scheduleMain');
  if(currentUser.role === 'trainer' || currentUser.role === 'owner') return renderScheduleTrainerOrOwner(main);
  if(currentUser.role === 'client') return renderScheduleClient(main);
}

/* used by the "המשבצות שלי" tab of renderScheduleTrainerOrOwner — renders the */
/* add-slot button + this trainer's own slot list into whatever container it's given. */
function renderMySlotsSection(container){
  var mySlots = sortSlots(state.slots.filter(function(s){ return s.trainerId===currentUser.trainerId; }));
  container.innerHTML =
    '<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;flex-wrap:wrap;gap:8px;">'+
      '<div class="section-title" style="margin:0;">המשבצות שלי</div>'+
      '<button class="btn btn-accent btn-sm" id="btnNewSlot">+ משבצת חדשה</button>'+
    '</div>'+
    '<div id="slotListTrainer"></div>';
  $('#btnNewSlot', container).addEventListener('click', function(){ openSlotForm(); });
  var list = $('#slotListTrainer', container);
  if(!mySlots.length){
    list.innerHTML = '<div class="empty-state"><h2>אין עדיין משבצות</h2><p>הוסיפו משבצת זמן פתוחה כדי שלקוחות יוכלו לקבוע תור.</p></div>';
    return;
  }
  list.innerHTML = mySlots.map(function(s){
    var client = s.clientId ? getClient(s.clientId) : null;
    var sub = s.status==='booked' ? ('נקבע עם: '+(client?client.name:'—')) : 'פנוי לקביעה';
    return slotCardHtml(fmtDate(s.date)+' · '+s.startTime+'–'+s.endTime, sub, slotChipHtml(s.status));
  }).join('');
}
function openSlotForm(){
  var today = new Date().toISOString().slice(0,10);
  var body =
    '<div class="form-grid">'+
      '<div class="form-row"><label>תאריך</label><input type="date" id="f_slot_date" value="'+today+'"></div>'+
      '<div class="form-row"><label>שעת התחלה</label><input type="time" id="f_slot_start" value="09:00"></div>'+
      '<div class="form-row"><label>שעת סיום (מחושב, '+SLOT_LENGTH_MIN+' דק׳)</label><div class="field-value" id="f_slot_end_preview">'+addMinutesToTime('09:00', SLOT_LENGTH_MIN)+'</div></div>'+
    '</div>';
  var foot = '<button class="btn" id="btnCancel">ביטול</button><button class="btn btn-accent" id="btnSave">שמירה</button>';
  openModal('משבצת זמן חדשה', body, foot);
  $('#btnCancel').addEventListener('click', closeModal);
  $('#f_slot_start').addEventListener('input', function(){
    var v = $('#f_slot_start').value;
    $('#f_slot_end_preview').textContent = v ? addMinutesToTime(v, SLOT_LENGTH_MIN) : '—';
  });
  $('#btnSave').addEventListener('click', async function(){
    var date = $('#f_slot_date').value, start = $('#f_slot_start').value;
    if(!date || !start){ alert('יש למלא תאריך ושעת התחלה'); return; }
    var end = addMinutesToTime(start, SLOT_LENGTH_MIN);
    var res = await sb.from('training_slots').insert({
      trainer_id: currentUser.trainerId, date: date, start_time: start, end_time: end, status: 'open'
    }).select().single();
    if(res.error){ alert('שגיאה בשמירת המשבצת (ייתכן שכבר קיימת משבצת באותו תאריך/שעה): '+res.error.message); return; }
    state.slots.push(slotFromRow(res.data));
    closeModal();
    renderSchedule();
  });
}

/* Both trainer and owner get the same two-tab schedule screen: "המשבצות שלי" to */
/* manage their own slots, and "כל המאמנים" to browse every trainer's slots (view-only) — */
/* every trainer can see every trainer's schedule since 19.08.26, see PROJECT.md "פישוט 19.08.26". */
function renderScheduleTrainerOrOwner(main){
  if(!state.scheduleTab) state.scheduleTab = 'mine';
  main.innerHTML =
    '<div class="profile-head"><div><h2>תיאום אימונים</h2><div class="profile-goal">'+
      (state.scheduleTab==='mine' ? 'משבצות הזמן שלך' : 'משבצות כל המאמנים')+
    '</div></div></div>'+
    '<div class="tabs">'+
      '<button class="tab" data-schedule-tab="mine">המשבצות שלי</button>'+
      '<button class="tab" data-schedule-tab="all">כל המאמנים</button>'+
    '</div>'+
    '<div id="scheduleTabBody" style="padding-top:14px;"></div>';
  $$('[data-schedule-tab]', main).forEach(function(b){
    if(b.dataset.scheduleTab===state.scheduleTab) b.classList.add('active');
    b.addEventListener('click', function(){
      state.scheduleTab = b.dataset.scheduleTab;
      renderScheduleTrainerOrOwner(main);
    });
  });
  var body = $('#scheduleTabBody', main);
  if(state.scheduleTab === 'mine') renderMySlotsSection(body);
  else renderAllTrainersSlots(body);
}
function renderAllTrainersSlots(container){
  var trainerOptions = state.trainers.map(function(t){
    return '<option value="'+t.id+'"'+(state.scheduleTrainerId===t.id?' selected':'')+'>'+t.name+'</option>';
  }).join('');
  container.innerHTML =
    '<div class="card"><div class="form-row"><label>סינון לפי מאמן/ת</label>'+
      '<select class="select" id="scheduleAllFilter"><option value="">כל המאמנים</option>'+trainerOptions+'</select>'+
    '</div></div>'+
    '<div id="allSlotList" style="margin-top:12px;"></div>';
  $('#scheduleAllFilter', container).addEventListener('change', function(e){
    state.scheduleTrainerId = e.target.value || null;
    renderAllSlotListBody($('#allSlotList', container));
  });
  renderAllSlotListBody($('#allSlotList', container));
}
function renderAllSlotListBody(container){
  var slots = sortSlots(state.scheduleTrainerId ? state.slots.filter(function(s){ return s.trainerId===state.scheduleTrainerId; }) : state.slots);
  if(!slots.length){ container.innerHTML = '<div class="empty-state"><h2>אין משבצות</h2></div>'; return; }
  container.innerHTML = slots.map(function(s){
    var t = state.trainers.find(function(tt){ return tt.id===s.trainerId; });
    var c = s.clientId ? getClient(s.clientId) : null;
    var sub = (t?t.name:'—') + (s.status==='booked' ? (' · נקבע עם '+(c?c.name:'—')) : ' · פנוי');
    return slotCardHtml(fmtDate(s.date)+' · '+s.startTime+'–'+s.endTime, sub, slotChipHtml(s.status));
  }).join('');
}

function renderScheduleClient(main){
  var myBookings = sortSlots(state.slots.filter(function(s){ return s.clientId===currentUser.clientId; }));
  var trainerOptions = state.trainers.map(function(t){
    return '<option value="'+t.id+'"'+(state.scheduleTrainerId===t.id?' selected':'')+'>'+t.name+'</option>';
  }).join('');
  main.innerHTML =
    '<div class="profile-head"><div><h2>תיאום אימונים</h2><div class="profile-goal">קביעת תור עם מאמן/ת</div></div></div>'+
    '<div class="card">'+
      '<div class="form-row"><label>בחר/י מאמן/ת</label>'+
        '<select class="select" id="scheduleTrainerSelect"><option value="">— בחרו —</option>'+trainerOptions+'</select>'+
      '</div>'+
      '<div id="openSlotsForTrainer"></div>'+
    '</div>'+
    '<div class="card" style="margin-top:16px;"><div class="section-title">התורים שלי</div><div id="myBookingsList"></div></div>';
  $('#scheduleTrainerSelect').addEventListener('change', function(e){
    state.scheduleTrainerId = e.target.value || null;
    renderOpenSlotsForTrainer();
  });
  renderOpenSlotsForTrainer();
  renderMyBookings(myBookings);
}
function renderOpenSlotsForTrainer(){
  var container = $('#openSlotsForTrainer');
  if(!state.scheduleTrainerId){ container.innerHTML=''; return; }
  var openSlots = sortSlots(state.slots.filter(function(s){ return s.trainerId===state.scheduleTrainerId && s.status==='open'; }));
  if(!openSlots.length){ container.innerHTML = '<p class="client-sub" style="margin-top:10px;">אין משבצות פנויות למאמן/ת זו כרגע.</p>'; return; }
  container.innerHTML = '<div style="margin-top:10px;">'+openSlots.map(function(s){
    return slotCardHtml(fmtDate(s.date)+' · '+s.startTime+'–'+s.endTime, '', '<button class="btn btn-accent btn-sm" data-book="'+s.id+'">קביעת תור</button>');
  }).join('')+'</div>';
  $$('[data-book]', container).forEach(function(b){
    b.addEventListener('click', function(){ bookSlot(b.dataset.book); });
  });
}
function renderMyBookings(list){
  var el = $('#myBookingsList');
  if(!list.length){ el.innerHTML = '<p class="client-sub">אין לך תורים קבועים כרגע.</p>'; return; }
  el.innerHTML = list.map(function(s){
    var t = state.trainers.find(function(tt){ return tt.id===s.trainerId; });
    return slotCardHtml(fmtDate(s.date)+' · '+s.startTime+'–'+s.endTime, 'עם '+(t?t.name:'—'), '');
  }).join('');
}
async function bookSlot(slotId){
  var res = await sb.from('training_slots').update({status:'booked', client_id: currentUser.clientId}).eq('id', slotId).select().single();
  if(res.error){
    alert('לא ניתן היה לקבוע את התור (ייתכן שמישהו כבר תפס את המשבצת). מרעננים את הרשימה.');
    try{ await loadState(); } catch(e){}
    renderSchedule();
    return;
  }
  var idx = state.slots.findIndex(function(s){ return s.id===slotId; });
  if(idx>-1) state.slots[idx] = slotFromRow(res.data); else state.slots.push(slotFromRow(res.data));
  renderSchedule();
  /* best-effort email notification — booking already succeeded regardless of this call's outcome */
  sb.functions.invoke('notify-booking', { body: { slotId: slotId } }).catch(function(){});
}

var splash = $('#splashScreen');
var dismissSplash = function(){ if(splash) splash.classList.add('hide'); };
if (splash) splash.addEventListener('click', dismissSplash);

/* ---------- login / role gate (added 04.08.26) ---------- */
function showLoginError(msg){
  var el = $('#loginError');
  el.textContent = msg;
  el.classList.remove('hidden');
}
function hideLoginError(){ $('#loginError').classList.add('hidden'); }

function showLoginScreen(){
  $('#app').classList.add('hidden');
  $('#loginScreen').classList.remove('hidden');
  dismissSplash();
}

async function afterLogin(session){
  var profile;
  try{ profile = await determineRole(session); }
  catch(err){
    showLoginError('שגיאה בזיהוי המשתמש: '+err.message);
    await sb.auth.signOut();
    showLoginScreen();
    return;
  }
  if(!profile){
    showLoginError('החשבון מחובר אך אינו משויך לפרופיל מאמן/לקוח באפליקציה. פנו לבעלים.');
    await sb.auth.signOut();
    showLoginScreen();
    return;
  }
  currentUser.session = session;
  currentUser.role = profile.role;
  currentUser.trainerId = profile.trainerId;
  currentUser.clientId = profile.clientId;
  document.body.classList.toggle('app-readonly', currentUser.role === 'client');

  try{
    await loadState();
  } catch(err){
    dismissSplash();
    $('#loginScreen').classList.add('hidden');
    $('#app').classList.remove('hidden');
    $('#main').innerHTML = '<div class="empty-state"><h2>שגיאה בטעינת הנתונים</h2><p>בדקו את החיבור לאינטרנט ורעננו את הדף.</p></div>';
    return;
  }

  var roleLabel = currentUser.role === 'owner' ? 'בעלים' : currentUser.role === 'trainer' ? 'מאמן/ת' : 'לקוח/ה';
  var badge = $('#roleBadge'); badge.textContent = roleLabel; badge.style.display = '';
  $('#navMain').textContent = currentUser.role === 'client' ? 'הפרופיל שלי' : 'לקוחות';
  state.view = 'main';
  updateNavActive();

  /* no per-trainer client filtering — every trainer (and the owner) sees every */
  /* client, client_trainers assignment was removed 19.08.26 (see PROJECT.md). */

  if(currentUser.role === 'client'){
    state.activeClientId = currentUser.clientId;
    $('#shell').setAttribute('data-view', 'detail');
    history.replaceState({view:'detail', clientId: currentUser.clientId}, '', location.href);
  } else {
    state.activeClientId = state.clients.length ? state.clients[0].id : null;
    history.replaceState({view:'list'}, '', location.href);
  }

  $('#loginScreen').classList.add('hidden');
  $('#app').classList.remove('hidden');
  renderAll();
  dismissSplash();
}

async function doLogin(){
  var email = $('#loginEmail').value.trim();
  var password = $('#loginPassword').value;
  if(!email || !password){ showLoginError('נא למלא אימייל וסיסמה'); return; }
  hideLoginError();
  $('#btnLogin').disabled = true;
  var res = await sb.auth.signInWithPassword({ email: email, password: password });
  $('#btnLogin').disabled = false;
  if(res.error){ showLoginError('התחברות נכשלה: '+res.error.message); return; }
  await afterLogin(res.data.session);
}
$('#btnLogin').addEventListener('click', doLogin);
$('#loginPassword').addEventListener('keydown', function(e){ if(e.key === 'Enter') doLogin(); });
$('#loginEmail').addEventListener('keydown', function(e){ if(e.key === 'Enter') $('#loginPassword').focus(); });

$('#btnLogout').addEventListener('click', async function(){
  await sb.auth.signOut();
  location.reload();
});

$('#navSchedule').addEventListener('click', goToSchedule);
$('#navMain').addEventListener('click', goToMainNav);

$('#searchInput').addEventListener('input', function(e){ renderRail(e.target.value); });
$('#btnNewClient').addEventListener('click', function(){ openClientForm(null); });
$('#fabNewClient').addEventListener('click', function(){ openClientForm(null); });

sb.auth.getSession().then(function(res){
  var session = res.data && res.data.session;
  if(!session){ showLoginScreen(); return; }
  afterLogin(session);
});

})();
</script>
</body>
